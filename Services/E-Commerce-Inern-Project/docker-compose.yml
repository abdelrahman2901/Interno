services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Interno_Sql_2026!"
    ports:
      - "1434:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"Interno_Sql_2026!\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - ecommerce-network

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-network

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ecommerce-network

  InternoMicroservice.api:
    image: interno-microservice.api
    build:
      context: .
      dockerfile: E-Commerce-Inerno.API/Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Server=sqlserver,1433;Initial Catalog=InternoMicroserviceDatabase;User Id=sa;Password=Interno_Sql_2026!;TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=True"
      RabbitMQ__RabbitMQ_HostName: rabbitmq
      RabbitMQ__RabbitMQ_UserName: user
      RabbitMQ__RabbitMQ_Password: password
      RabbitMQ__RabbitMQ_Port: 5672
      Redis__Host: redis
      Redis__Port: 6379
    networks:
      - ecommerce-network

  AuditMicroservice.api:
    image: audit-microservice.api
    build:
      context: ../E-Commerce-Microservice-Audit
      dockerfile: Audit-Microservice.API/Dockerfile
    ports:
      - "5001:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Server=sqlserver,1433;Initial Catalog=AuditMicroservice;User Id=sa;Password=Interno_Sql_2026!;TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=True"
      RabbitMQ_HostName: rabbitmq
      RabbitMQ_UserName: user
      RabbitMQ_Password: password
      RabbitMQ_Port: 5672
    networks:
      - ecommerce-network

  NotificationMicroservice.api:
    image: notification-microservice.api
    build:
      context: ../E-Commerce-Microservice-Notification
      dockerfile: Microservice-Notification.API/Dockerfile
    ports:
      - "5002:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Server=sqlserver,1433;Initial Catalog=NotificationMicroservice;User Id=sa;Password=Interno_Sql_2026!;TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=True"
      RabbitMQ_HostName: rabbitmq
      RabbitMQ_UserName: user
      RabbitMQ_Password: password
      RabbitMQ_Port: 5672
    networks:
      - ecommerce-network

networks:
  ecommerce-network:

volumes:
  redis-data:
  sqlserver-data:
